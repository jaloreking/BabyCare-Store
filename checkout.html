<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout – Cash on Delivery | Jay&amp;Joy</title><meta name="description" content="Place your Jay&amp;Joy order. Cash on Delivery only.">
<meta property="og:title" content="Checkout – Cash on Delivery | Jay&amp;Joy"><meta property="og:description" content="Place your Jay&amp;Joy order. Cash on Delivery only."><meta property="og:type" content="website"><meta property="og:image" content="images/placeholder.svg">
<link rel="canonical" href="https://jaloreking.github.io/BabyCare-Store/checkout.html"><link rel="icon" href="images/placeholder.svg"><link rel="stylesheet" href="style.css"></head>
<body data-page="checkout"><header id="hdr"></header><main class="wrap">
<h1>Checkout</h1><div id="sum"></div>
<form id="f" novalidate class="fg"><h2>Delivery Details</h2>
<label for="name">Full name</label><input id="name" name="name" autocomplete="name">
<label for="mobile">Mobile number</label><input id="mobile" name="mobile" inputmode="numeric" maxlength="10" autocomplete="tel">
<label for="wa">WhatsApp number</label><input id="wa" name="wa" inputmode="numeric" maxlength="10">
<label for="addr">Full delivery address</label><textarea id="addr" name="addr" rows="3"></textarea>
<label for="city">City</label><input id="city" name="city"><label for="state">State</label><input id="state" name="state">
<label for="pin">PIN code</label><input id="pin" name="pin" inputmode="numeric" maxlength="6">
<p id="err" role="alert"></p><button class="btn wa" type="submit">Place Order on WhatsApp</button></form><div id="done"></div>
</main><footer id="ftr"></footer><script src="script.js"></script></body></html>
